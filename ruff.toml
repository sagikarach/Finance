# Lint config. Conservative, high-signal rules:
#   F   = pyflakes (unused imports/vars, redefinitions, undefined names)
#   E9  = syntax errors
#   BLE = flake8-blind-except (BLE001: `except Exception`/`except BaseException`)
#   S110/S112 = bandit: `try ... except: pass` / `except: continue`
#
# The BLE/S11x rules ban silent blanket-excepts — the idiom that hid the
# atomic-write corruption and the shadowed button style. Enforced across the
# whole tree now: pure/logic/IO layers narrow to finance.utils.safe.PARSE_ERRORS
# (or swallow() for logged best-effort network blocks); the Qt boundary
# (widgets/pages/ui) narrows to finance.utils.safe.QT_ERRORS. Only the three
# files below stay exempt (see each note).
line-length = 100
extend-exclude = ["**/__pycache__", "build", "dist"]

[lint]
select = ["F", "E9", "BLE", "S110", "S112"]

[lint.per-file-ignores]
# app.py wires the Qt app + stdio/stderr together; its guards are startup-only.
"finance/app.py" = ["BLE", "S110", "S112"]
# qt.py is the PySide import shim — defensive fallbacks are its whole job.
"finance/qt.py" = ["BLE", "S110", "S112"]
# icons.py renders SVGs through PySide — part of the Qt boundary.
"finance/utils/icons.py" = ["BLE", "S110", "S112"]
# Tests may assert on broad failure paths.
"tests/*" = ["BLE", "S110", "S112"]
