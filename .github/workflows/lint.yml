name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.12.5
      - run: ruff check finance/ tests/

  # Type-check the Qt-free logic layers (models/data/utils). The Qt boundary is
  # excluded — the qt.py `Any` shim makes it too noisy to gate — so this catches
  # type/signature/None drift where it actually causes bugs. pyrightconfig.json
  # excludes utils/icons.py and demotes missing-import (optional deps) to warnings.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g pyright@1.1.411
      - run: pyright finance/models finance/data finance/utils
